<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0f12, #18181f);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-color: #ff0055;
      --primary-gradient: linear-gradient(135deg, #ff0055, #e0003c);
      --accent-gradient: linear-gradient(90deg, #ff0055, #ff5500);
      --text-main: #ffffff;
      --text-muted: #9da5b4;
      --text-dim: #5c626f;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 24px;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Container */
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.15));
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    /* Main Action Button */
    .btn-scrape {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .btn-scrape:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.5);
      filter: brightness(1.1);
    }

    .btn-scrape:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(255, 0, 85, 0.3);
    }

    .btn-scrape:disabled {
      background: #282830;
      color: var(--text-dim);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Progress UI */
    .progress-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: none; /* Hidden by default */
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      width: 200px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #1e1e24;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 999px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 85, 0, 0.5);
    }

    .progress-percentage {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-color);
      text-align: right;
    }

    /* Stats Section */
    .stats-section {
      background: rgba(0, 220, 100, 0.03);
      border: 1px solid rgba(0, 220, 100, 0.15);
      border-radius: 12px;
      padding: 16px;
      display: none; /* Hidden until success */
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stats-title {
      font-size: 14px;
      font-weight: 600;
      color: #00dc64;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--primary-color);
      text-decoration: underline;
    }

    .btn-check {
      width: 100%;
      background: linear-gradient(135deg, #00dc64, #00b050);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 220, 100, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 220, 100, 0.45);
      filter: brightness(1.1);
    }

    .btn-check:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(0, 220, 100, 0.25);
    }

    .btn-check:disabled {
      background: #282830;
      color: var(--text-dim);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tubescraper</h1>
      <p>Scrape YouTube video list data with exact timezone-converted upload times.</p>
    </div>

    <button id="download" class="btn-scrape">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Scrape & Download CSV
    </button>

    <button id="checkExact" class="btn-check">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      Check Exact Upload Times
    </button>

    <div id="progressSection" class="progress-section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="statusText" class="status-text">Scanning page...</span>
        <span id="progressPercent" class="progress-percentage">0%</span>
      </div>
      <div class="progress-bar-container">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div id="statsSection" class="stats-section">
      <div class="stats-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Successfully Exported!
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Videos Scraped</div>
          <div id="statVideosCount" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Elapsed Time</div>
          <div id="statTimeElapsed" class="stat-value">0s</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Made with 💻 by <a href="https://patriagani.com" target="_blank">patriagani</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
